
background {
    monitor =
    path = ~/.cache/niri-blurred-wall.png
    blur_passes = 3
    blur_size = 7
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.2
}


label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    font_family = Symbols Nerd Font
    position = 0, 100
    halign = center
    valign = center
}


input-field {
    monitor =
    size = 200, 40
    
    
    outline_thickness = 0
    
    
    inner_color = rgba(17, 17, 17, 0.2)
    
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}
